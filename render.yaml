services:
  - type: web
    name: lab-tracker
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node build
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: TURSO_URL
        sync: false  # set in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false  # set in Render dashboard
      - key: APP_PASSWORD
        sync: false  # set in Render dashboard
